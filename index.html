<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRoster — Datastraw Roster Management System</title>
  <meta name="description" content="Smart Roster Management System for D2C operations teams. Plan, generate, and validate monthly rosters across multiple brands, processes, and pods." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <nav id="sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <div class="sidebar-logo">SR</div>
      <div class="sidebar-title">
        SmartRoster
        <span>Roster planning</span>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>
      <button type="button" class="nav-item active" data-page="dashboard" aria-label="Dashboard" aria-current="page" onclick="navigate('dashboard')">
        <span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Dashboard</span>
      </button>

      <button type="button" class="nav-item" data-page="roster" aria-label="Roster" onclick="navigate('roster')">
        <span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label">Roster</span>
      </button>
      <button type="button" class="nav-item" data-page="conflicts" aria-label="Conflicts" onclick="navigate('conflicts')">
        <span class="nav-icon" aria-hidden="true">!</span><span class="nav-label">Conflicts</span>
      </button>

      <div class="nav-section-label">Team setup</div>
      <button type="button" class="nav-item" data-page="employees" aria-label="People and pods" onclick="navigate('employees')">
        <span class="nav-icon" aria-hidden="true">◉</span><span class="nav-label">People & pods</span>
      </button>
      <button type="button" class="nav-item" data-page="brands" aria-label="Brands and processes" onclick="navigate('brands')">
        <span class="nav-icon" aria-hidden="true">◇</span><span class="nav-label">Brands & processes</span>
      </button>
      <button type="button" class="nav-item" data-page="leaves" aria-label="Leave and holidays" onclick="navigate('leaves')">
        <span class="nav-icon" aria-hidden="true">○</span><span class="nav-label">Leave & holidays</span>
      </button>

      <div class="nav-section-label">App</div>
      <button type="button" class="nav-item" data-page="settings" aria-label="Settings" onclick="navigate('settings')">
        <span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-label">Settings</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="nav-item" id="sidebar-toggle" aria-label="Collapse navigation" aria-expanded="true" onclick="toggleSidebar()">
        <span class="nav-icon" aria-hidden="true">‹</span><span class="nav-label">Collapse navigation</span>
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div id="main">

    <!-- TOP BAR -->
    <header id="topbar">
      <div class="topbar-left">
        <div>
          <div class="topbar-title" id="page-title">Dashboard</div>
          <div class="topbar-subtitle" id="page-description">Your team and roster at a glance.</div>
        </div>
      </div>
      <div class="topbar-right">
        <button type="button" class="conflict-badge hidden" id="global-conflict-badge" onclick="navigate('conflicts')">0 conflicts</button>
        <div class="date-chip">
          <span aria-hidden="true">Today</span>
          <span id="today-label"></span>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main id="page-content">
      <div class="empty-state">
        <div class="spinner"></div>
        <div class="empty-title">Loading your workspace…</div>
      </div>
    </main>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" style="display:none"></div>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Working…</div>
</div>

<!-- SCRIPTS -->
<script src="data.js"></script>
<script src="scheduler.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
<script>
  // Set today label
  const todayD = new Date();
  document.getElementById('today-label').textContent =
    todayD.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
</script>
</body>
</html>
